<!DOCTYPE html><html><body>
<script type="importmap">{"imports":{"three":"./three/three.module.js","three/addons/":"./three/addons/"}}</script>
<script type="module">
// Builds animals.glb: Rocketbox (MIT) dromedary and donkey, rigged, textured, in metres, facing +Z.
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const L = new FBXLoader(), tl = new THREE.TextureLoader();
const load = (u) => new Promise((res, rej) => L.load(u, res, undefined, rej));
const tex = (f, srgb) => new Promise((res) => tl.load('assets/' + f, (t) => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.userData.mimeType = 'image/jpeg'; t.name = f; res(t); }));
(async () => {
  const root = new THREE.Group(); root.name = 'animals'; const info = {};
  for (const [name, file, col, nrm] of [['camel', 'Camel_OneHump_01', 'dromedar_color.jpg', 'dromedar_normal.jpg'], ['donkey', 'Donkey_Grey_01', 'donkey_gray_color.jpg', null]]) {
    const o = await load('assets/' + file + '.fbx'), map = await tex(col, 1), normalMap = nrm ? await tex(nrm) : null;
    o.traverse((c) => { if (c.isMesh) { c.material = new THREE.MeshStandardMaterial({ name, map, normalMap, roughness: 0.88 }); } });
    o.scale.setScalar(0.01); o.updateMatrixWorld(true);
    // turn to face +Z: from the pelvis toward the head
    const pre = name === 'camel' ? 'dromedar_' : 'donkey_', h = o.getObjectByName(pre + 'Head').getWorldPosition(new THREE.Vector3()), p = o.getObjectByName(pre + 'Pelvis').getWorldPosition(new THREE.Vector3());
    const yaw = Math.atan2(h.x - p.x, h.z - p.z); const holder = new THREE.Group(); holder.name = name; holder.rotation.y = -yaw; holder.add(o); root.add(holder);
    holder.updateMatrixWorld(true); const box = new THREE.Box3().setFromObject(holder); info[name] = { yaw: +yaw.toFixed(2), size: box.getSize(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)), minY: +box.min.y.toFixed(2) };
  }
  const glb = await new GLTFExporter().parseAsync(root, { binary: true });
  window.__glb = Array.from(new Uint8Array(glb)); info.bytes = glb.byteLength; window.__info = info; window.__ready = true;
})().catch((e) => { window.__info = { err: String(e.stack || e) }; window.__ready = true; });
</script></body></html>
